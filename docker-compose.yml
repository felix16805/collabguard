services:
  mongodb:
    image: mongo:7.0
    container_name: collabguard-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=collabguard
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5.18-community
    container_name: collabguard-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP Web Browser Interface
      - "7687:7687"   # Bolt Driver Protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/collabguard_neo4j_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p collabguard_neo4j_password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./collabguard-backend
      dockerfile: Dockerfile
    container_name: collabguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=True
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=collabguard
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=collabguard_neo4j_password
      - JWT_SECRET_KEY=collabguard_super_secret_jwt_key_2026_change_in_production
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    depends_on:
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./collabguard-frontend
      dockerfile: Dockerfile
    container_name: collabguard-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mongodb_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
